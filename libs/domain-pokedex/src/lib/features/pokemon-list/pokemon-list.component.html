<nav class="tools-nav">
	<a routerLink="/pokedex/pokemon" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Pokedex</a>
	<a routerLink="/pokedex/moves" routerLinkActive="active">Moves</a>
	<a routerLink="/pokedex/analyzer" routerLinkActive="active">Analyzer</a>
	<a routerLink="/pokedex/coverage" routerLinkActive="active">Coverage</a>
	<a routerLink="/pokedex/compare" routerLinkActive="active">Compare</a>
</nav>
<pokedex-pokemon-filters [(search)]="search" [(types)]="types" [(generation)]="generation" [(sortBy)]="sortBy" [(sortDesc)]="sortDesc" />

<div class="grid">
	@if (loading() && !pokemons().length) {
		@for (s of skeletons; track $index) {
			<pokedex-skeleton height="190px" radius="var(--r-lg)" />
		}
	} @else {
		@for (pokemon of pokemons(); track pokemon.id) {
			<a class="card-link" [routerLink]="[pokemon.id]">
				<pokedex-pokemon-card
					[dexNumber]="pokemon.id"
					[name]="pokemon.identifier"
					[types]="pokemon.types | pokemonTypes"
					[src]="spriteUrl(pokemon.id)"
					[fallbackSrc]="fallbackUrl(pokemon.id)"
				/>
			</a>
		}
		@if (!pokemons().length) {
			<p class="empty">No pokémon match those filters.</p>
		}
	}
</div>
