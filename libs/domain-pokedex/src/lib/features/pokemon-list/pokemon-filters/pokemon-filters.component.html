<div class="filters">
	<input type="search" placeholder="Search pokemon (typo-friendly)…" [value]="search()" (input)="onSearch($event)" />
	<select (change)="onGeneration($event)" title="Generation">
		<option value="" [selected]="generation() === null">All gens</option>
		@for (gen of generations; track gen) {
			<option [value]="gen" [selected]="generation() === gen">Gen {{ gen }}</option>
		}
	</select>
	<select (change)="onSort($event)" title="Sort by">
		@for (option of sortOptions; track option) {
			<option [value]="option" [selected]="sortBy() === option">Sort: {{ option }}</option>
		}
	</select>
	<button type="button" class="dir" (click)="sortDesc.set(!sortDesc())" [title]="sortDesc() ? 'Descending' : 'Ascending'">
		{{ sortDesc() ? '↓' : '↑' }}
	</button>
	<button type="button" (click)="saveCurrent()" title="Save current search + facets + game as a filter set">💾 Save filter</button>
	@for (filter of store.savedFilters(); track filter.name) {
		<span class="filter-chip">
			<button
				type="button"
				class="apply"
				(click)="apply(filter)"
				[title]="'search: ' + (filter.search || '—') + ' · game: ' + (filter.versionGroup || 'all') + ' · types: ' + (filter.types?.join(',') || 'any')"
			>
				{{ filter.name }}
			</button>
			<button type="button" class="delete" (click)="remove(filter)" [attr.aria-label]="'Delete filter ' + filter.name">✕</button>
		</span>
	}
</div>
<div class="type-facets">
	@for (type of allTypes(); track type.id) {
		<button type="button" class="type-chip" [class.active]="types().includes(type.identifier)" (click)="toggleType(type.identifier)">
			{{ type.identifier }}
		</button>
	}
</div>
