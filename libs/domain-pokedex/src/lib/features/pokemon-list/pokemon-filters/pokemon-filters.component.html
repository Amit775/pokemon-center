<div class="filters">
	<input class="search" type="search" placeholder="Search pokémon (typo-friendly)…" [value]="search()" (input)="onSearch($event)" />

	<label class="select">
		Gen
		<select (change)="onGeneration($event)">
			<option value="" [selected]="generation() === null">All</option>
			@for (gen of generations; track gen) {
				<option [value]="gen" [selected]="generation() === gen">{{ gen }}</option>
			}
		</select>
	</label>

	<label class="select">
		Sort
		<select (change)="onSort($event)">
			@for (option of sortOptions; track option) {
				<option [value]="option" [selected]="sortBy() === option">{{ option }}</option>
			}
		</select>
	</label>

	<button type="button" class="dir" (click)="sortDesc.set(!sortDesc())" [attr.aria-label]="sortDesc() ? 'Descending' : 'Ascending'">
		{{ sortDesc() ? '↓' : '↑' }}
	</button>

	<button type="button" class="save" (click)="saveCurrent()">💾 Save filter</button>

	@for (filter of store.savedFilters(); track filter.name) {
		<span class="filter-chip">
			<button type="button" class="apply" (click)="apply(filter)">{{ filter.name }}</button>
			<button type="button" class="delete" (click)="remove(filter)" [attr.aria-label]="'Delete filter ' + filter.name">✕</button>
		</span>
	}
</div>

<div class="type-facets">
	@for (type of allTypes(); track type.id) {
		<pkd-chip-toggle [label]="type.identifier" [type]="type.identifier" [active]="types().includes(type.identifier)" (toggled)="toggleType(type.identifier)" />
	}
</div>
