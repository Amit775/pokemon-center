<div class="shell">
	<div class="list-pane">
		@if (loading()) {
			<p>Loading…</p>
		} @else {
			<pokedex-data-table
				[data]="rows()"
				[columns]="columns"
				[(sorting)]="sorting"
				[(columnFilters)]="columnFilters"
				[(globalFilter)]="globalFilter"
				[rowVariant]="rowVariant"
				[virtualScroll]="true"
				[rowHeight]="48"
				[viewportHeight]="'calc(100vh - 160px)'"
				label="Pokédex"
				emptyLabel="No Pokémon match your filters."
			/>
		}
	</div>

	<div class="detail-pane">
		<router-outlet />
	</div>
</div>
