@if (move(); as move) {
	<div>{{ move.identifier }}</div>
	<div>{{ move.canonicalId }}</div>
	<div>power: {{ move.power ?? '—' }}</div>
	<div>accuracy: {{ move.accuracy ?? '—' }}</div>
	<div>pp: {{ move.pp ?? '—' }}</div>
	<div>type: {{ move.type.identifier }}</div>
	<div>class: {{ move.damageClass.identifier }}</div>
}
