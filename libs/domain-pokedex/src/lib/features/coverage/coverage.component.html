<h2>Coverage Checker</h2>
<p class="hint">Add up to four attacking moves (by slug, e.g. <code>thunderbolt</code>). See the best damage multiplier each defending type takes.</p>

<div class="move-input">
	<input type="text" placeholder="move slug + Enter…" [value]="draft()" (input)="onInput($event)" (keydown.enter)="addMove()" [disabled]="moves().length >= 4" />
	@for (move of moves(); track move) {
		<span class="move-chip">
			{{ move }}
			<button type="button" (click)="removeMove(move)" [attr.aria-label]="'Remove ' + move">✕</button>
		</span>
	}
</div>

@if (cells().length) {
	<pkd-matchup-grid [cells]="cells()" />
}
