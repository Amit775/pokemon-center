<header class="app-bar">
	<span class="brand">Pokémon</span>
	<nav class="nav">
		@for (nav of navRoutes; track nav) {
			<a [routerLink]="nav.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: nav.path === '' }">{{ nav.display }}</a>
		}
	</nav>
	<span class="spacer"></span>
	<div class="tools">
		<pokedex-omnisearch />
		<pokedex-game-select />
		<button type="button" class="icon-btn" (click)="store.toggleTheme()" [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'">
			<mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
		</button>
	</div>
</header>
<router-outlet />
