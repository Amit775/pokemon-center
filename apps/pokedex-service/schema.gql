type Query {
  ability(idOrSlug: String!): Abilities
  abilityList(skip: Int! = 0, take: Int! = 50): [Abilities!]!

  """
  For a set of moves, the best damage multiplier achieved against each of the 18 defending types
  """
  coverage(moves: [String!]!): [CoverageCell!]!

  """
  Every species in the pokemon evolution chain, with evolution conditions
  """
  evolutionChain(idOrSlug: String!): [PokemonSpecies!]!
  item(idOrSlug: String!): Items
  itemList(search: String, skip: Int! = 0, take: Int! = 50): [Items!]!

  """
  Best offensive counters against a defender with the given types, honoring STAB, the attacker offensive stat, and (optionally) a version group regional dex + learnset
  """
  matchupAnalysis(defenderTypes: [String!]!, take: Int! = 15, versionGroup: String): [MatchupCounter!]!

  """Lookup by canonical id (move:63), numeric id, or slug (thunderbolt)"""
  move(idOrSlug: String!): Moves

  """Move flavor text entries, optionally per version group"""
  moveFlavor(idOrSlug: String!, versionGroup: String): [MoveFlavorText!]!

  """Pokemon that can learn a move, optionally per version group"""
  moveLearnedBy(idOrSlug: String!, take: Int! = 500, versionGroup: String): [PokemonMoves!]!

  """Paginated move list, optionally fuzzy-filtered by name"""
  moveList(search: String, skip: Int! = 0, take: Int! = 50): [Moves!]!

  """Lookup by canonical id (pokemon:25), numeric id, or slug (pikachu)"""
  pokemon(idOrSlug: String!): Pokemon

  """
  Where to catch a pokemon: locations, methods, levels, rarity - optionally per version group
  """
  pokemonEncounters(idOrSlug: String!, take: Int! = 500, versionGroup: String): [Encounters!]!

  """
  Pokedex flavor entries for a pokemon, optionally scoped to a version group
  """
  pokemonFlavor(idOrSlug: String!, versionGroup: String): [PokemonSpeciesFlavorText!]!

  """
  Paginated pokemon list; optionally fuzzy-filtered by name and scoped to a version group regional dex
  """
  pokemonList(
    """Introduced-in generation id"""
    generation: Int
    search: String
    skip: Int! = 0

    """id | name | height | weight"""
    sortBy: String
    sortDesc: Boolean! = false
    take: Int! = 50

    """Type slugs; pokemon matching ANY of them"""
    types: [String!]

    """Version group slug, e.g. firered-leafgreen"""
    versionGroup: String
  ): [Pokemon!]!

  """Moves learnable by a pokemon, optionally per version group"""
  pokemonMoves(idOrSlug: String!, skip: Int! = 0, take: Int! = 100, versionGroup: String): [PokemonMoves!]!

  """
  Fuzzy, multilingual search across pokemon, moves, abilities, items and types
  """
  search(takePerKind: Int! = 5, term: String!): [SearchHit!]!
  species(idOrSlug: String!): PokemonSpecies
  type(idOrSlug: String!): Types
  typeList: [Types!]!

  """All version groups (games), in release order, with their versions"""
  versionGroups: [VersionGroups!]!
}

